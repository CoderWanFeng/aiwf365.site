<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="50%" style="stop-color:#16213e"/>
      <stop offset="100%" style="stop-color:#0f3460"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <circle cx="600" cy="80" r="80" fill="#e94560" opacity="0.1"/>
  <circle cx="100" cy="400" r="100" fill="#0f3460" opacity="0.3"/>
  <text x="400" y="230" font-family="system-ui,sans-serif" font-size="48" font-weight="bold" fill="#fff" text-anchor="middle" filter="url(#glow)">新项目</text>
  <text x="400" y="280" font-family="system-ui,sans-serif" font-size="24" fill="#999" text-anchor="middle">点击编辑内容</text>